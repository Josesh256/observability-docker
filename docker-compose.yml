version: '3.8'

services:
  # VPN Access Gateway with Web UI (WG-Easy)
  wireguard:
    image: ghcr.io/wg-easy/wg-easy:latest
    container_name: wg_easy
    cap_add:
      - NET_ADMIN
      - SYS_MODULE
    environment:
      - WG_HOST=${WG_SERVERURL}
      - PASSWORD_HASH=${WG_UI_PASSWORD_HASH}
      - WG_PORT=${WIREGUARD_PORT}
      - WG_DEFAULT_DNS=${WG_PEER_DNS}
      - WG_DEFAULT_ADDRESS=10.8.0.x
      - WG_ALLOWED_IPS=0.0.0.0/0
    volumes:
      - ./vpn/config:/etc/wireguard
    ports:
      - "${WIREGUARD_PORT}:51820/udp"
      - "${WG_UI_PORT}:51821/tcp"
    sysctls:
      - net.ipv4.conf.all.src_valid_mark=1
      - net.ipv4.ip_forward=1
    restart: unless-stopped


  # Simple User Application (Nginx webserver serving static website)
  nginx:
    image: nginx:alpine
    container_name: web_app
    ports:
      - "${NGINX_PORT}:80"
    volumes:
      - ./apps/web/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./apps/web/html:/usr/share/nginx/html:ro
    restart: unless-stopped

  # System metrics collection agent
  node-exporter:
    image: prom/node-exporter:latest
    container_name: node_exporter
    volumes:
      - /proc:/host/proc:ro
      - /sys:/host/sys:ro
      - /:/rootfs:ro
    command:
      - '--path.procfs=/host/proc'
      - '--path.rootfs=/rootfs'
      - '--path.sysfs=/host/sys'
      - '--collector.filesystem.mount-points-exclude=^/(sys|proc|dev|host|etc)($$|/)'
    expose:
      - 9100
    restart: unless-stopped

  # Metrics collector & Time-Series DB
  prometheus:
    image: prom/prometheus:latest
    container_name: prometheus
    volumes:
      - ./monitoring/prometheus:/etc/prometheus:ro
      - prometheus_data:/prometheus
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'
      - '--storage.tsdb.path=/prometheus'
      - '--web.console.libraries=/etc/prometheus/console_libraries'
      - '--web.console.templates=/etc/prometheus/consoles'
      - '--web.enable-lifecycle'
    ports:
      - "${PROMETHEUS_PORT}:9090"
    restart: unless-stopped

  # Visualization Dashboard UI
  grafana:
    image: grafana/grafana:latest
    container_name: grafana
    ports:
      - "${GRAFANA_PORT}:3000"
    environment:
      - GF_SECURITY_ADMIN_PASSWORD=${GF_SECURITY_ADMIN_PASSWORD}
      - GF_USERS_ALLOW_SIGN_UP=false
    volumes:
      - ./monitoring/grafana/provisioning:/etc/grafana/provisioning:ro
      - grafana_data:/var/lib/grafana
    restart: unless-stopped

  # Alertmanager to handle alerts and dispatch to Telegram
  alertmanager:
    image: prom/alertmanager:latest
    container_name: alertmanager
    ports:
      - "9093:9093"
    volumes:
      - ./monitoring/alertmanager:/etc/alertmanager:ro
    restart: unless-stopped

  # Nginx Prometheus Exporter to read metrics from the Nginx status page
  nginx-exporter:
    image: nginx/nginx-prometheus-exporter:latest
    container_name: nginx_exporter
    command:
      - -nginx.scrape-uri=http://web_app:80/nginx_status
    ports:
      - "9113:9113"
    restart: unless-stopped

volumes:
  prometheus_data:
  grafana_data:
